<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security & Cryptography Group Registration</title>
<style>
body{margin:0;background:#f3f7fb;color:#19344d;font:16px/1.55 Segoe UI,Arial,sans-serif}header{background:linear-gradient(135deg,#071a30,#155c8c);color:white;padding:42px 20px}.wrap,main{max-width:1050px;margin:auto}main{padding:22px 17px}.panel,.group{background:white;border:1px solid #d7e3ed;border-radius:14px;padding:16px;margin:13px 0;box-shadow:0 8px 24px #081a3015}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}select,input,button{font:inherit;padding:10px;border-radius:8px}select,input{width:100%;border:1px solid #b8cad8;box-sizing:border-box}button{border:0;background:#071a30;color:white;font-weight:800;cursor:pointer}.groups{display:grid;grid-template-columns:1fr 1fr;gap:13px}.meta{display:flex;justify-content:space-between}.members{list-style:none;padding:0}.members li{padding:7px;border-bottom:1px solid #edf2f6}.available{color:#718497;font-style:italic}.negative{background:#fff0f1;border-left:4px solid #d7505d;padding:9px}.join{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:10px}.status{padding:12px;background:#e4f7fb;border-left:5px solid #22bdd9;border-radius:9px}.error{background:#fff0f1;border-left-color:#d7505d}.ok{background:#eaf8f1;border-left-color:#24a66f}.mine{outline:3px solid #22bdd9}@media(max-width:700px){.groups,.controls,.join{grid-template-columns:1fr}}
</style></head>
<body><header><div class="wrap"><small>SHARED PROJECT ASSIGNMENT PORTAL</small><h1>Security & Cryptography</h1><p>Computer Science and Software Engineering group registration</p><b>Teaching Assistant: Eng. Mina</b></div></header>
<main><div id="status" class="status">Connecting to Firebase…</div><section class="panel"><div class="controls"><div><label>Department</label><select id="dept"><option value="CS">Computer Science</option><option value="SE">Software Engineering</option></select></div><div><label>Search</label><input id="search" placeholder="Group or scenario"></div></div><p>Maximum four students per group. Names saved here appear to all visitors.</p></section><div id="groups" class="groups"></div></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import{getAuth,signInAnonymously,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import{getDatabase,ref,onValue}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-functions.js';
import{firebaseConfig}from'./firebase-config.js';
const S=['Secure University Assignment Submission','Digital Certificate Issuing and Verification','Secure Medical Record Exchange','Secure Staff Messaging','Secure Online Examination Distribution','Password Manager','File Integrity Monitoring','Client-Side Encrypted Cloud Storage','Secure Banking Transaction Prototype','IoT Environmental Sensor Security','Software Download Integrity Checker','Secure Team File Vault','University ID Verification Prototype','API Request Authentication','Secure Backup and Restore','Certificate Inspection and Warning Tool','Secure Attendance Record System','Research Dataset Sharing','Secure E-Portfolio Submission','Confidential Feedback Collection','Secure License or Token Validator','Encrypted Personal Notes Application','Secure QR Document Verification','Log Integrity and Chain Verification','Secure Group Key Distribution Simulation'];
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),fn=getFunctions(app),join=httpsCallable(fn,'joinGroup'),leave=httpsCallable(fn,'leaveGroup');let user,groups={},unsub;const $=x=>document.getElementById(x),safe=x=>String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(x,c=''){ $('status').textContent=x;$('status').className='status '+c }
function sub(){if(unsub)unsub();unsub=onValue(ref(db,'groups/'+$('dept').value),s=>{groups=s.val()||{};render();msg('Live database connected.','ok')},e=>msg(e.message,'error'))}
function render(){const d=$('dept').value,q=$('search').value.toLowerCase();$('groups').innerHTML=S.map((title,k)=>{let n=k+1,c=`${d}-G${String(n).padStart(2,'0')}`,m=Object.values(groups[c]?.members||{}),mine=m.some(x=>x.ownerUid===user?.uid);if(!(c+' '+title).toLowerCase().includes(q))return'';let list=m.map(x=>`<li><b>${safe(x.name)}</b> — ${safe(x.studentId)}</li>`).join('');for(let i=m.length;i<4;i++)list+='<li class="available">Available</li>';return`<article class="group ${mine?'mine':''}"><div class="meta"><b>${c}</b><span>${m.length}/4</span></div><h3>${safe(title)}</h3><div class="negative"><b>Required negative test:</b> Test invalid or modified input as specified by Eng. Mina.</div><ul class="members">${list}</ul>${mine?`<button data-leave="${c}">Leave group</button>`:m.length<4?`<form class="join" data-code="${c}"><div><label>Full name</label><input name="name" required maxlength="80"></div><div><label>Student ID</label><input name="studentId" required maxlength="30" pattern="[A-Za-z0-9_-]+"></div><button>Join</button></form>`:''}</article>`}).join('');document.querySelectorAll('form').forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{await join({department:d,groupCode:f.dataset.code,name:f.name.value,studentId:f.studentId.value});msg('Saved successfully.','ok')}catch(x){msg(x.message,'error')}});document.querySelectorAll('[data-leave]').forEach(b=>b.onclick=async()=>{try{await leave({department:d,groupCode:b.dataset.leave});msg('Removed.','ok')}catch(x){msg(x.message,'error')}})}
$('dept').onchange=sub;$('search').oninput=render;onAuthStateChanged(auth,u=>{user=u;if(u)sub()});signInAnonymously(auth).catch(e=>msg(e.message,'error'));
</script></body></html>
